<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 蜃気楼・シネマティックプリズムグラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- アプリアイコン背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#312e81" stroke-width="6" />

  <!-- レンズグロー -->
  <circle cx="256" cy="256" r="180" fill="url(#lensGlow)" />

  <!-- 外枠サークル（カメラレンズのフォーカスリング） -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#475569" stroke-width="3" opacity="0.5" />

  <!-- 絞り羽（Aperture）デザイン -->
  <g transform="translate(256, 256)" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M 0 -85 L 75 -40" />
    <path d="M 75 -40 L 75 48" />
    <path d="M 75 48 L 0 92" />
    <path d="M 0 92 L -75 48" />
    <path d="M -75 48 L -75 -40" />
    <path d="M -75 -40 L 0 -85" />
  </g>

  <!-- 光学プリズムの中心コア -->
  <polygon points="256,206 300,282 212,282" fill="url(#accentGrad)" opacity="0.9" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />
</svg>
